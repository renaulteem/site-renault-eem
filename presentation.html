<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Présentation – Renault Gambetta, Noisy-le-Sec</title>
  <meta name="description" content="Renault Gambetta, agent Renault et garage multimarque au 17-21 boulevard Gambetta à Noisy-le-Sec : notre histoire, notre équipe, notre atelier.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=34">
</head>
<body data-page="apropos">
  <div id="site-header"></div>

  <section class="page-hero ab-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Accueil</a> / Présentation</div>
      <span class="eyebrow">Présentation</span>
      <h1 id="a-titre"></h1>
      <p id="a-intro"></p>
    </div>
  </section>

  <!-- Photo de couverture + chiffres clés -->
  <section class="ab-cover-wrap">
    <div class="container">
      <div class="ab-show reveal" id="a-slides" aria-roledescription="diaporama" aria-label="Photos du garage">
        <div class="ab-show-media" id="a-track"></div>
        <div class="ab-show-panel">
          <span class="ab-show-count" id="a-count"></span>
          <div class="ab-show-caption" id="a-caption" aria-live="polite"></div>
          <div class="ab-show-ctrl">
            <button class="ab-sl-nav" id="a-prev" aria-label="Photo précédente">‹</button>
            <button class="ab-sl-nav" id="a-next" aria-label="Photo suivante">›</button>
            <div class="ab-show-bar"><span id="a-bar"></span></div>
          </div>
        </div>
      </div>
      <div class="ab-facts reveal" id="a-chiffres"></div>
    </div>
  </section>

  <!-- Histoire + photo -->
  <section class="section ab-story-wrap">
    <div class="container ab-story">
      <div class="ab-story-text reveal">
        <span class="eyebrow">Notre histoire</span>
        <h2>Une équipe expérimentée, le savoir-faire Renault.</h2>
        <div id="a-histoire"></div>
        <ol class="ab-values" id="a-valeurs"></ol>
        <a class="btn btn-yellow" data-tel href="#">Nous appeler · <span data-num></span></a>
      </div>
      <figure class="ab-story-photo reveal" id="a-photo2"></figure>
    </div>
  </section>

  <!-- Agrandissement des photos -->
  <div class="ab-lightbox" id="a-lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
    <button class="ab-lb-close" aria-label="Fermer">×</button>
    <button class="ab-lb-nav prev" aria-label="Photo précédente">‹</button>
    <img id="a-lb-img" alt="">
    <button class="ab-lb-nav next" aria-label="Photo suivante">›</button>
  </div>

  <div id="site-footer"></div>

  <script src="assets/config.js?v=33"></script>
  <script src="assets/main.js?v=33"></script>
  <script>
  (async function () {
    // Contenu modifiable depuis l'espace /admin (fichier data/apropos.json)
    let A = {};
    try { A = await (await fetch("data/apropos.json", { cache: "no-store" })).json(); } catch {}
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const photos = A.photos || [];

    $("a-titre").textContent = A.titre || "Présentation";
    $("a-intro").textContent = A.intro || "";

    // diaporama : photo entière à gauche, légende à droite
    const track = $("a-track");
    const items = photos.map((p) => (typeof p === "string" ? { photo: p } : p));
    const src = (i) => items[i] && items[i].photo;
    if (!items.length) $("a-slides").remove();
    else {
      track.innerHTML = items.map((it, i) => `<img class="ab-show-img${i ? "" : " on"}" src="${esc(it.photo)}" alt="${esc(it.titre || "Renault Gambetta")}" data-i="${i}">`).join("");
      const imgs = [...track.children];
      let cur = 0, timer;
      const pad = (n) => String(n).padStart(2, "0");
      const render = () => {
        const it = items[cur];
        $("a-count").textContent = `${pad(cur + 1)} / ${pad(items.length)}`;
        $("a-caption").classList.remove("in");
        setTimeout(() => {
          $("a-caption").innerHTML = `${it.titre ? `<h3>${esc(it.titre)}</h3>` : ""}${it.texte ? `<p>${esc(it.texte)}</p>` : ""}`;
          $("a-caption").classList.add("in");
        }, 150);
        const bar = $("a-bar"); bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
      };
      const go = (i) => { imgs[cur].classList.remove("on"); cur = (i + imgs.length) % imgs.length; imgs[cur].classList.add("on"); render(); };
      const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const auto = () => { clearInterval(timer); if (!calm) timer = setInterval(() => go(cur + 1), 6000); };
      $("a-prev").onclick = () => { go(cur - 1); auto(); };
      $("a-next").onclick = () => { go(cur + 1); auto(); };
      $("a-slides").addEventListener("mouseenter", () => { clearInterval(timer); $("a-slides").classList.add("paused"); });
      $("a-slides").addEventListener("mouseleave", () => { $("a-slides").classList.remove("paused"); auto(); });
      let x0 = null;
      track.addEventListener("touchstart", (e) => (x0 = e.touches[0].clientX), { passive: true });
      track.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { go(cur + (dx < 0 ? 1 : -1)); auto(); } x0 = null; });
      if (items.length < 2) $("a-slides").querySelector(".ab-show-ctrl").remove();
      render(); auto();
    }

    // chiffres clés : libellé au-dessus, valeur en grand
    $("a-chiffres").innerHTML = (A.chiffres || []).map((c) => `
      <div class="ab-fact">
        <span class="ab-fact-value">${esc(c.valeur)}</span>
        ${c.libelle ? `<span class="ab-fact-label">${esc(c.libelle)}</span>` : ""}
      </div>`).join("");

    // histoire
    $("a-histoire").innerHTML = String(A.histoire || "").split(/\n\s*\n/).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
    $("a-valeurs").innerHTML = (A.valeurs || []).map((v) => `<li>${esc(v)}</li>`).join("");
    if (photos[1]) $("a-photo2").innerHTML = `<img src="${esc(src(1))}" alt="Renault Gambetta" loading="lazy" data-i="1">`;
    else $("a-photo2").remove();

    // apparition au défilement (le contenu est ajouté après le chargement)
    const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && (e.target.classList.add("in"), io.unobserve(e.target))), { threshold: 0.12 });
    document.querySelectorAll(".reveal:not(.in)").forEach((el) => io.observe(el));

    // agrandissement au clic
    const lb = $("a-lightbox"), lbImg = $("a-lb-img");
    let cur = 0;
    const show = (i) => { cur = (i + items.length) % items.length; lbImg.src = src(cur); };
    const close = () => { lb.classList.remove("open"); document.body.style.overflow = ""; };
    document.addEventListener("click", (e) => {
      const img = e.target.closest("img[data-i]");
      if (img) { show(+img.dataset.i); lb.classList.add("open"); document.body.style.overflow = "hidden"; return; }
      if (!lb.classList.contains("open")) return;
      if (e.target.closest(".prev")) show(cur - 1);
      else if (e.target.closest(".next")) show(cur + 1);
      else if (e.target === lb || e.target.closest(".ab-lb-close")) close();
    });
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowRight") show(cur + 1);
      if (e.key === "ArrowLeft") show(cur - 1);
    });
  })();
  </script>
</body>
</html>
