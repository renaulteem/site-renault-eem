<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Présentation – Renault Gambetta, Noisy-le-Sec</title>
  <meta name="description" content="Renault Gambetta, agent Renault et garage multimarque au 17-21 boulevard Gambetta à Noisy-le-Sec : notre histoire, notre équipe, notre atelier.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=36">
</head>
<body data-page="apropos">
  <div id="site-header"></div>

  <section class="page-hero ab-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Accueil</a> / Présentation</div>
      <span class="eyebrow">Présentation</span>
      <h1 id="a-titre"></h1>
      <p id="a-intro"></p>
    </div>
  </section>

  <!-- Façade + chiffres clés -->
  <section class="ab-cover-wrap">
    <div class="container">
      <div class="ab-rows" id="a-first"></div>
      <div class="ab-facts reveal" id="a-chiffres"></div>
    </div>
  </section>

  <!-- Histoire : chaque paragraphe accompagné d'une ou deux photos -->
  <section class="section ab-story-wrap">
    <div class="container">
      <div class="ab-story-head reveal">
        <span class="eyebrow">Notre histoire</span>
        <h2>Une équipe expérimentée, le savoir-faire Renault.</h2>
      </div>
      <div class="ab-chapters" id="a-chapters"></div>
    </div>
  </section>

  <!-- Contact & rendez-vous (identique à l'accueil) -->
  <section class="section tight" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <h2>Contact &amp; rendez-vous</h2>
      </div>
      <div class="tiles contact reveal">
        <div class="tile"><div class="tile-body">
          <span class="eyebrow">Téléphone</span>
          <a class="big-tel" data-tel href="#"><span data-num></span></a>
          <a class="link-arrow" href="#" id="mail"></a>
          <div class="note">Pour joindre notre <strong>commercial</strong> (véhicules neufs et occasions), appelez ce même numéro.</div>
          <a class="btn btn-yellow" data-tel href="#" style="margin-top:22px;align-self:flex-start">Appeler maintenant</a>
        </div></div>
        <div class="tile"><div class="tile-body">
          <span class="eyebrow">Horaires</span>
          <table id="horaires"></table>
          <span class="eyebrow">Adresse</span>
          <address><strong>Renault Gambetta</strong><br><span data-text="adresse"></span><br><span data-text="ville"></span></address>
          <a class="link-arrow" data-href="lienMaps" data-arrow href="#" target="_blank" rel="noopener">Itinéraire</a>
        </div></div>
        <div class="tile map"><iframe id="map" title="Plan d'accès Renault Gambetta" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      </div>
    </div>
  </section>

  <!-- Agrandissement des photos -->
  <div class="ab-lightbox" id="a-lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
    <button class="ab-lb-close" aria-label="Fermer">×</button>
    <button class="ab-lb-nav prev" aria-label="Photo précédente">‹</button>
    <img id="a-lb-img" alt="">
    <button class="ab-lb-nav next" aria-label="Photo suivante">›</button>
  </div>

  <div id="site-footer"></div>

  <script src="assets/config.js?v=33"></script>
  <script src="assets/main.js?v=33"></script>
  <script>
  (async function () {
    // Contenu modifiable depuis l'espace /admin (fichier data/apropos.json)
    let A = {};
    try { A = await (await fetch("data/apropos.json", { cache: "no-store" })).json(); } catch {}
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const photos = A.photos || [];

    $("a-titre").textContent = A.titre || "Présentation";
    $("a-intro").textContent = A.intro || "";

    // façade en grand, puis les autres photos réparties à côté des paragraphes (par 2)
    const items = photos.map((p) => (typeof p === "string" ? { photo: p } : p));
    const src = (i) => items[i] && items[i].photo;
    if (items[0]) $("a-first").innerHTML = `<figure class="ab-hero-photo reveal"><img src="${esc(items[0].photo)}" alt="${esc(items[0].titre || "Renault Gambetta")}" data-i="0"></figure>`;
    else $("a-first").remove();
    const fig = (it, i) => `
      <figure class="ab-fig">
        <img src="${esc(it.photo)}" alt="${esc(it.titre || "Renault Gambetta")}" data-i="${i}" loading="lazy">
        ${it.titre || it.texte ? `<figcaption>${it.titre ? `<strong>${esc(it.titre)}</strong>` : ""}${it.texte ? ` ${esc(it.texte)}` : ""}</figcaption>` : ""}
      </figure>`;
    const paras = String(A.histoire || "").split(/\n\s*\n/).filter(Boolean);
    const rest = items.slice(1).map((it, k) => ({ it, i: k + 1 }));
    const per = Math.max(1, Math.ceil(rest.length / Math.max(paras.length, 1)));
    $("a-chapters").innerHTML = paras.map((p, k) => {
      const group = rest.slice(k * per, k * per + per);
      const last = k === paras.length - 1;
      return `
      <div class="ab-chapter reveal">
        <div class="ab-chapter-text">
          <p>${esc(p).replace(/\n/g, "<br>")}</p>
          ${last ? `<ol class="ab-values">${(A.valeurs || []).map((v) => `<li>${esc(v)}</li>`).join("")}</ol>
          <a class="btn btn-yellow" href="#contact">Nous contacter</a>` : ""}
        </div>
        <div class="ab-chapter-photos">${group.map((g) => fig(g.it, g.i)).join("")}</div>
      </div>`;
    }).join("");
    // les photos d'un même paragraphe prennent la même hauteur, chacune en entier
    document.querySelectorAll(".ab-fig img").forEach((img) => {
      const set = () => { if (img.naturalWidth) img.closest(".ab-fig").style.flex = `${img.naturalWidth / img.naturalHeight} 1 0`; };
      img.complete ? set() : img.addEventListener("load", set);
    });

    // contact
    document.getElementById("horaires").innerHTML = SITE.horaires.map(([j, h]) => `<tr><td>${j}</td><td>${h}</td></tr>`).join("");
    const mail = document.getElementById("mail"); mail.href = "mailto:" + SITE.email; mail.textContent = SITE.email;
    document.getElementById("map").src = SITE.carteEmbed;

    // chiffres clés : libellé au-dessus, valeur en grand
    $("a-chiffres").innerHTML = (A.chiffres || []).map((c) => `
      <div class="ab-fact">
        <span class="ab-fact-value">${esc(c.valeur)}</span>
        ${c.libelle ? `<span class="ab-fact-label">${esc(c.libelle)}</span>` : ""}
      </div>`).join("");

    // apparition au défilement (le contenu est ajouté après le chargement)
    const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && (e.target.classList.add("in"), io.unobserve(e.target))), { threshold: 0.12 });
    document.querySelectorAll(".reveal:not(.in)").forEach((el) => io.observe(el));

    // agrandissement au clic
    const lb = $("a-lightbox"), lbImg = $("a-lb-img");
    let cur = 0;
    const show = (i) => { cur = (i + items.length) % items.length; lbImg.src = src(cur); };
    const close = () => { lb.classList.remove("open"); document.body.style.overflow = ""; };
    document.addEventListener("click", (e) => {
      const img = e.target.closest("img[data-i]");
      if (img) { show(+img.dataset.i); lb.classList.add("open"); document.body.style.overflow = "hidden"; return; }
      if (!lb.classList.contains("open")) return;
      if (e.target.closest(".prev")) show(cur - 1);
      else if (e.target.closest(".next")) show(cur + 1);
      else if (e.target === lb || e.target.closest(".ab-lb-close")) close();
    });
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowRight") show(cur + 1);
      if (e.key === "ArrowLeft") show(cur - 1);
    });
  })();
  </script>
</body>
</html>
